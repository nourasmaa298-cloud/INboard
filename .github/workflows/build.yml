name: Build INboard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Extract INboard.zip and upload its contents."
            find . -maxdepth 3 -not -path "./.git/*" | head -n 50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project dir: $(dirname "$f")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INboard-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          
